<!doctype html>
<html lang="en" data-lang="en" dir="ltr" data-title-key="home.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guts Decor</title>
<meta name="description" content="Handmade custom wooden swords and display pieces, made by hand in Cairo.">
<meta name="theme-color" content="#1E0B2E">
<link rel="icon" type="image/png" href="assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<script>(function(){var l;try{l=localStorage.getItem("gd-lang")}catch(e){}if(l!=="en"&&l!=="ar"){l=/^ar\b/i.test(navigator.language||"")?"ar":"en"}var h=document.documentElement;h.setAttribute("data-lang",l);h.lang=l;h.dir=l==="ar"?"rtl":"ltr"})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700&family=Cinzel:wght@600;700&family=Montserrat:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/style.css?v=20261029a">
</head>
<body data-page="home">
<header id="site-header"></header>

<main id="main">

  <!-- First screen: background loop, headline, offer, main button -->
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero-media-wrap" id="hero-media"></div>
    <div class="hero-inner">
      <img class="hero-logo" id="hero-logo" src="assets/img/logo-240.png" alt="Guts Decor" width="120" height="120">
      <div class="hands-wrap hidden" id="hands-wrap"><div class="hands" id="hands-video"></div></div>
      <h1 id="hero-title" data-t="home.headline"></h1>
      <p class="hero-sub" data-t="home.subline"></p>
      <p class="hero-offer" id="hero-offer"></p>
      <a class="btn btn-gold" href="order.html" data-t="home.start"></a>
      <div><p class="spots hidden" id="spots" aria-live="polite"></p></div>
    </div>
  </section>

  <!-- Gift or for me, right under the first screen -->
  <section class="section paths" aria-label="Who is it for">
    <div class="wrap grid grid-2">
      <a class="card path-card" href="order.html?gift=1">
        <h2 class="h3" data-t="home.gift.title"></h2>
        <p class="muted" data-t="home.gift.text"></p>
        <span class="btn btn-gold" data-t="home.gift.button"></span>
      </a>
      <a class="card path-card" href="order.html">
        <h2 class="h3" data-t="home.me.title"></h2>
        <p class="muted" data-t="home.me.text"></p>
        <span class="btn btn-ghost" data-t="home.me.button"></span>
      </a>
    </div>
  </section>

  <div class="trust" id="trust"></div>

  <!-- Maker story -->
  <section class="section" aria-labelledby="story-title">
    <div class="wrap story">
      <div class="story-media" id="story-media-wrap">
        <div class="video-spot" id="meet-video"></div>
      </div>
      <div class="story-text">
        <h2 id="story-title" data-t="home.story.title"></h2>
        <p class="lead" data-t="home.story.text"></p>
        <a class="btn btn-ghost" href="#swords" data-t="home.story.button"></a>
      </div>
    </div>
  </section>

  <!-- Swords -->
  <section class="section alt" id="swords" aria-labelledby="swords-title">
    <div class="wrap">
      <h2 id="swords-title" class="center" data-t="home.swords.title"></h2>
      <p class="center muted" data-t="home.swords.sub"></p>
      <div class="grid grid-3 products" id="design-list"></div>
      <h3 class="center sub-title" data-t="home.tiers.title"></h3>
      <div class="grid grid-4" id="tier-list"></div>
      <p class="teaser" data-t="home.teaser"></p>
    </div>
  </section>

  <!-- Make it a centrepiece -->
  <section class="section" aria-labelledby="centre-title">
    <div class="wrap">
      <h2 id="centre-title" class="center" data-t="home.centre.title"></h2>
      <div class="grid grid-2">
        <div class="card">
          <h3 data-t="home.centre.display.title"></h3>
          <p class="muted" data-t="home.centre.display.text"></p>
          <a class="btn btn-ghost" href="gallery.html?filter=decor" data-t="home.centre.display.button"></a>
        </div>
        <div class="card">
          <h3 data-t="home.centre.comm.title"></h3>
          <p class="muted" data-t="home.centre.comm.text"></p>
          <a class="btn btn-ghost" href="order.html?tier=VIP" data-t="home.centre.comm.button"></a>
        </div>
      </div>
    </div>
  </section>

  <!-- How it works -->
  <section class="section alt" aria-labelledby="how-title">
    <div class="wrap">
      <h2 id="how-title" class="center" data-t="home.how.title"></h2>
      <ol class="steps">
        <li><h3 data-t="home.how.1.t"></h3><p class="muted" data-t="home.how.1.d"></p></li>
        <li><h3 data-t="home.how.2.t"></h3><p class="muted" data-t="home.how.2.d"></p></li>
        <li><h3 data-t="home.how.3.t"></h3><p class="muted" data-t="home.how.3.d"></p></li>
        <li><h3 data-t="home.how.4.t"></h3><p class="muted" data-t="home.how.4.d"></p></li>
        <li><h3 data-t="home.how.5.t"></h3><p class="muted" data-t="home.how.5.d"></p></li>
      </ol>
      <p class="notice hold center" data-t="home.hold"></p>
      <div class="center"><a class="btn btn-gold" href="order.html" data-t="home.start"></a></div>
    </div>
  </section>

  <!-- Guarantee -->
  <section class="section" aria-labelledby="guarantee-title">
    <div class="wrap">
      <div class="guarantee">
        <h2 id="guarantee-title" class="center" data-t="home.guarantee.title"></h2>
        <ol>
          <li data-t="home.guarantee.1"></li>
          <li data-t="home.guarantee.2"></li>
          <li data-t="home.guarantee.3"></li>
        </ol>
        <div class="signature center"><img src="assets/signature.png" alt="" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="sig-text" data-t="home.guarantee.sign" hidden></span></div>
        <div class="center"><a class="btn btn-gold" href="order.html" data-t="home.start"></a></div>
      </div>
    </div>
  </section>

  <!-- Reviews reel (hidden when the Videos tab has no reel) -->
  <section class="section alt hidden" id="reviews" aria-labelledby="reviews-title">
    <div class="wrap center">
      <h2 id="reviews-title" data-t="home.reviews.title"></h2>
      <div class="reel" id="reviews-reel"></div>
      <a class="btn btn-gold" href="order.html" data-t="home.reviews.button"></a>
    </div>
  </section>

  <!-- FAQ -->
  <section class="section" id="faq" aria-labelledby="faq-title">
    <div class="wrap faq narrow">
      <h2 id="faq-title" class="center" data-t="home.faq.title"></h2>
      <div id="faq-list"></div>
      <div class="center" data-dm></div>
    </div>
  </section>

  <!-- Final next step -->
  <section class="section alt center" aria-labelledby="final-title">
    <div class="wrap">
      <h2 id="final-title" data-t="home.final.title"></h2>
      <div data-dm></div>
      <a class="btn btn-ghost" href="order.html" data-t="home.final.order"></a>
    </div>
  </section>

</main>

<footer id="site-footer"></footer>
<script src="assets/js/site.js?v=20261029a"></script>
<script src="assets/js/videos.js?v=20261029a"></script>
<script src="assets/js/home.js?v=20261029a"></script>
</body>
</html>
