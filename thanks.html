<!doctype html>
<html lang="en" data-lang="en" dir="ltr" data-title-key="th.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guts Decor</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1E0B2E">
<link rel="icon" type="image/png" href="assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<script>(function(){var l;try{l=localStorage.getItem("gd-lang")}catch(e){}if(l!=="en"&&l!=="ar"){l=/^ar\b/i.test(navigator.language||"")?"ar":"en"}var h=document.documentElement;h.setAttribute("data-lang",l);h.lang=l;h.dir=l==="ar"?"rtl":"ltr"})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;500;600&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Montserrat:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/style.css?v=20261113c">
</head>
<body data-page="thanks">
<header id="site-header"></header>

<main id="main" class="page">
  <!-- The order is saved as "Started (waiting for DM)". One last step: send it in an Instagram chat. -->
  <section class="intro th-intro" aria-labelledby="th-title">
    <div class="inner center">
      <p class="eyebrow" data-t="th.dm.label"></p>
      <h1 class="stepped italic-title" id="th-title" data-t="th.dm.headline"></h1>
      <p class="th-code-label" data-t="th.code"></p>
      <div class="code-box" id="code">GD-····</div>
      <p class="body-copy th-lead" data-t="th.dm.lead"></p>
      <button type="button" class="btn btn-gold th-send" id="th-send" data-track="tap:send-order"></button>
      <p class="th-copied hidden" id="th-copied" role="status" data-t="dm.copied"></p>

      <div class="th-msg-box" id="th-msg-wrap">
        <p class="th-msg-label" data-t="th.dm.summary"></p>
        <pre class="th-msg" id="th-msg" dir="auto"></pre>
        <button type="button" class="btn btn-ghost th-copy" id="th-copy" data-t="th.dm.copy"></button>
      </div>
    </div>
  </section>

  <section class="ivory i-sec" aria-labelledby="th-next-title">
    <div class="inner">
      <h2 class="head-2" id="th-next-title" data-t="ship.how.title"></h2>
      <ol class="steps3">
        <li><span class="no">1</span><span class="txt" data-t="ship.step.1"></span></li>
        <li class="star"><span class="no">2</span><span class="txt"><strong data-t="ship.step.2"></strong><span class="star-note" data-t="ship.step.2.note"></span></span></li>
        <li><span class="no">3</span><span class="txt" data-t="ship.step.3"></span></li>
      </ol>
      <p class="th-ready" id="th-date"></p>
      <div class="after-link"><a class="link-u" href="shipping.html" data-t="ship.more"></a></div>
    </div>
  </section>

  <section class="final">
    <div class="photo-card tall hidden" id="thanks-video-wrap"><div class="video-spot" id="thanks-video"></div></div>
    <div class="after-link"><a class="link-u" href="index.html" data-t="th.shop"></a></div>
  </section>
</main>

<footer id="site-footer"></footer>
<script src="assets/js/site.js?v=20261113c"></script>
<script src="assets/js/videos.js?v=20261113c"></script>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var code = (q.get("code") || "").toUpperCase();
    var days = Math.min(90, Math.max(1, Number(q.get("d")) || 14));
    var good = /^GD-[A-Z0-9]{4}$/.test(code);
    if (good) document.getElementById("code").textContent = code;

    // The order message saved by the checkout (or the order form). After a reload on another phone it may be gone:
    // then the customer just sends the order number.
    var saved = null;
    try { saved = JSON.parse(sessionStorage.getItem("gd-order-msg") || "null"); } catch (e) { saved = null; }
    function message() {
      if (saved && saved.code === code && saved.msg) return saved.msg;
      return GD.tx("th.dm.fallback", { code: good ? code : "" });
    }

    document.getElementById("th-send").addEventListener("click", function () {
      GD.dm(message()).then(function (ok) { document.getElementById("th-copied").classList.toggle("hidden", !ok); });
    });
    document.getElementById("th-copy").addEventListener("click", function () {
      var b = this;
      GD.copy(message()).then(function (ok) {
        b.textContent = ok ? GD.tx("th.dm.copied") : GD.tx("th.dm.copyFail");
        if (!ok) { // select the text so it can be copied by hand
          var r = document.createRange(); r.selectNodeContents(document.getElementById("th-msg"));
          var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        }
      });
    });

    GD.mountTalking("thanks-video-wrap", "thanks-video", "thanks", { titleKey: "thanks.video.title", altKey: "thanks.video.alt" });
    GD.onContent(function () {
      document.getElementById("th-send").innerHTML =
        '<svg class="ig-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.3" fill="currentColor"/></svg><span>' +
        GD.esc(GD.tx("th.dm.send")) + "</span>";
      document.getElementById("th-msg").textContent = message();
      var d = new Date(); d.setDate(d.getDate() + days);
      document.getElementById("th-date").textContent = GD.tx("th.dm.ready", {
        date: d.toLocaleDateString(GD.lang() === "ar" ? "ar-EG" : "en-GB", { day: "numeric", month: "long" })
      });
    });
  })();
</script>
</body>
</html>
