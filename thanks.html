<!doctype html>
<html lang="en" data-lang="en" dir="ltr" data-title-key="th.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guts Decor</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1E0B2E">
<link rel="icon" type="image/png" href="assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<script>(function(){var l;try{l=localStorage.getItem("gd-lang")}catch(e){}if(l!=="en"&&l!=="ar"){l=/^ar\b/i.test(navigator.language||"")?"ar":"en"}var h=document.documentElement;h.setAttribute("data-lang",l);h.lang=l;h.dir=l==="ar"?"rtl":"ltr"})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;500;600&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Montserrat:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/style.css?v=20261030d">
</head>
<body data-page="thanks">
<header id="site-header"></header>

<main id="main" class="page">
  <section class="intro th-intro" aria-labelledby="th-title">
    <div class="inner center">
      <p class="eyebrow" data-t="th.label"></p>
      <h1 class="stepped italic-title" id="th-title" data-t="th.headline"></h1>
      <p class="body-copy th-lead" id="th-lead"></p>
      <p class="th-code-label" data-t="th.code"></p>
      <div class="code-box" id="code">GD-····</div>
      <p class="body-copy th-save" data-t="th.save"></p>
      <a class="btn btn-gold hidden" id="th-upload" href="pay.html" data-t="th.upload"></a>
      <div class="photo-card tall hidden" id="thanks-video-wrap"><div class="video-spot" id="thanks-video"></div></div>
    </div>
  </section>

  <section class="ivory i-sec" aria-labelledby="th-next-title">
    <div class="inner">
      <p class="eyebrow" id="th-next-title" data-t="th.next.label"></p>
      <ul class="n-list">
        <li><span class="no">01</span><span class="txt"><span class="tt" data-t="th.next.1.t"></span><span class="bd" data-t="th.next.1.d"></span></span></li>
        <li><span class="no">02</span><span class="txt"><span class="tt" data-t="th.next.2.t"></span><span class="bd" data-t="th.next.2.d"></span></span></li>
        <li><span class="no">03</span><span class="txt"><span class="tt" data-t="th.next.3.t"></span><span class="bd" id="th-date"></span></span></li>
        <li><span class="no">04</span><span class="txt"><span class="tt" data-t="th.next.4.t"></span><span class="bd" data-t="th.next.4.d"></span></span></li>
        <li><span class="no">05</span><span class="txt"><span class="tt" data-t="th.next.5.t"></span><span class="bd" data-t="th.next.5.d"></span></span></li>
      </ul>
    </div>
  </section>

  <section class="final">
    <div class="ig-link"><a id="th-ig" href="https://ig.me/m/guts_san_store" target="_blank" rel="noopener" data-track="tap:ig" data-t="th.ig"></a></div>
    <div class="after-link"><a class="link-u" href="index.html" data-t="th.shop"></a></div>
  </section>
</main>

<footer id="site-footer"></footer>
<script src="assets/js/site.js?v=20261030d"></script>
<script src="assets/js/videos.js?v=20261030d"></script>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var code = (q.get("code") || "").toUpperCase();
    var shot = q.get("s");
    var days = Math.min(90, Math.max(1, Number(q.get("d")) || 14));
    if (/^GD-[A-Z0-9]{4}$/.test(code)) {
      document.getElementById("code").textContent = code;
      document.getElementById("th-upload").href = "pay.html?code=" + encodeURIComponent(code);
    }
    document.getElementById("th-upload").classList.toggle("hidden", shot !== "0");
    GD.mountTalking("thanks-video-wrap", "thanks-video", "thanks", { titleKey: "thanks.video.title", altKey: "thanks.video.alt" });
    GD.onContent(function (c) {
      document.getElementById("th-lead").textContent = shot === "1" ? GD.tx("th.inWithShot") : shot === "0" ? GD.tx("th.inNoShot") : "";
      var d = new Date(); d.setDate(d.getDate() + days);
      document.getElementById("th-date").textContent = GD.tx("th.next.3.d", {
        date: d.toLocaleDateString(GD.lang() === "ar" ? "ar-EG" : "en-GB", { day: "numeric", month: "long" })
      });
      document.getElementById("th-ig").href = "https://ig.me/m/" + encodeURIComponent(c.settings.instagram || "guts_san_store");
    });
  })();
</script>
</body>
</html>
