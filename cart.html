<!doctype html>
<html lang="en" data-lang="en" dir="ltr" data-title-key="cart.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guts Decor</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1E0B2E">
<link rel="icon" type="image/png" href="assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<script>(function(){var l;try{l=localStorage.getItem("gd-lang")}catch(e){}if(l!=="en"&&l!=="ar"){l=/^ar\b/i.test(navigator.language||"")?"ar":"en"}var h=document.documentElement;h.setAttribute("data-lang",l);h.lang=l;h.dir=l==="ar"?"rtl":"ltr"})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;500;600&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Montserrat:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/style.css?v=20261030d">
</head>
<body data-page="cart">
<header id="site-header"></header>

<main id="main">
  <section class="ivory cart-sec" aria-labelledby="cart-heading">
    <div class="cart-wrap">
      <p class="eyebrow" data-t="cart.label"></p>
      <h1 id="cart-heading" class="italic-title" data-t="cart.heading"></h1>
      <p class="notice hidden" id="cart-changed" role="status" data-t="cart.changed"></p>
      <ul class="cart-list" id="cart-list"></ul>
      <div class="cart-empty hidden" id="cart-empty">
        <p data-t="cart.empty"></p>
        <a class="btn btn-gold" href="index.html#designs" data-t="cart.browse"></a>
      </div>
      <div class="cart-sum hidden" id="cart-sum">
        <dl>
          <div class="row"><dt data-t="cart.total"></dt><dd id="cart-total"></dd></div>
          <div class="row big"><dt id="cart-deposit-label"></dt></div>
        </dl>
        <p class="cart-rest" data-t="cart.rest"></p>
        <a class="btn btn-gold" href="checkout.html" id="cart-checkout" data-track="cta:cart" data-t="cart.checkout"></a>
        <div><a class="link-u" href="index.html#designs" data-t="cart.continue"></a></div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>
<script src="assets/js/site.js?v=20261030d"></script>
<script src="assets/js/shop.js?v=20261030d"></script>
<script src="assets/js/cart.js?v=20261030d"></script>
</body>
</html>
