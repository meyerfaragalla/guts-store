<!doctype html>
<html lang="en" data-lang="en" dir="ltr" data-title-en="Upload a payment | Guts Decor" data-title-ar="ارفع إيصال الدفع | Guts Decor">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload a payment | Guts Decor</title>
<meta name="theme-color" content="#1E0B2E">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/GD-Mark.png">
<script>(function(){var l;try{l=localStorage.getItem("gd-lang")}catch(e){}if(l!=="en"&&l!=="ar"){l=/^ar\b/i.test(navigator.language||"")?"ar":"en"}var h=document.documentElement;h.setAttribute("data-lang",l);h.lang=l;h.dir=l==="ar"?"rtl":"ltr"})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700&family=Cinzel:wght@600;700&family=Montserrat:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="pay">
<header id="site-header"></header>

<main id="main" class="section">
  <div class="wrap form-card">
    <h1 class="center"><span data-l="en">Upload a payment</span><span data-l="ar">ارفع إيصال الدفع</span></h1>
    <p class="center muted"><span data-l="en">Paid by InstaPay? Upload a screenshot of the receipt here and I'll check it.</span><span data-l="ar">دفعت بالـ InstaPay؟ ارفع صورة الإيصال هنا وأنا هراجعها.</span></p>

    <section class="hidden" id="pay-video-wrap" aria-labelledby="pay-video-title" style="margin-bottom:24px">
      <h2 id="pay-video-title" class="center" style="font-size:1.3rem"><span data-l="en">How paying works</span><span data-l="ar">الدفع بيمشي إزاي</span></h2>
      <div class="video-spot" id="pay-video"></div>
    </section>

    <form id="lookup-form" class="card" novalidate>
      <div class="field">
        <label for="code"><span data-l="en">Your order code</span><span data-l="ar">كود الطلب</span> <span class="req">*</span></label>
        <input type="text" id="code" name="code" maxlength="7" autocomplete="off" dir="ltr" placeholder="GD-XXXX" style="text-transform:uppercase">
        <div class="err hidden" id="err-code"></div>
      </div>
      <button type="submit" class="btn btn-gold" id="lookup-btn"><span data-l="en">Find my order</span><span data-l="ar">دوّر على طلبي</span></button>
    </form>

    <div class="card hidden" id="order-box" style="margin-top:22px" aria-live="polite">
      <dl class="summary" style="display:grid;grid-template-columns:1fr auto;gap:8px 16px">
        <dt class="muted"><span data-l="en">Order</span><span data-l="ar">الطلب</span></dt><dd id="o-code" style="margin:0;font-weight:700;direction:ltr"></dd>
        <dt class="muted"><span data-l="en">Amount to pay</span><span data-l="ar">المبلغ المطلوب</span></dt><dd id="o-amount" style="margin:0;font-weight:800;color:var(--gold)"></dd>
      </dl>
      <p class="notice small" id="anti-scam"></p>

      <form id="upload-form" novalidate class="hidden">
        <div class="field">
          <label for="receipt"><span data-l="en">Receipt screenshot</span><span data-l="ar">صورة الإيصال</span> <span class="req">*</span></label>
          <input type="file" id="receipt" name="receipt" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" aria-describedby="receipt-hint">
          <p class="hint" id="receipt-hint"><span data-l="en">Images only, up to 10 MB.</span><span data-l="ar">صور بس، لحد ١٠ ميجا.</span></p>
          <div class="err hidden" id="err-receipt"></div>
        </div>
        <button type="submit" class="btn btn-gold" id="upload-btn"><span data-l="en">Upload receipt</span><span data-l="ar">ارفع الإيصال</span></button>
      </form>
      <p class="muted hidden" id="nothing-due"></p>
    </div>

    <div class="status hidden" id="pay-status" role="status"></div>
  </div>
</main>

<footer id="site-footer"></footer>
<script src="assets/js/site.js"></script>
<script src="assets/js/videos.js"></script>
<script src="assets/js/pay.js"></script>
<script>
  GD.mountTalking("pay-video-wrap", "pay-video", "payment", {
    en: "How paying works", ar: "الدفع بيمشي إزاي",
    altEn: "Paying the deposit by InstaPay", altAr: "دفع العربون بالـ InstaPay"
  });
</script>
</body>
</html>
